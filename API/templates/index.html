<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ рынка недвижимости</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input,
        button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 16px;
            border: none;
        }

        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        #reportStatus {
            text-align: center;
            font-weight: bold;
            color: #007bff;
        }

        #downloadReportBtn {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Генерация отчета</h2>

        <label for="dataFile">Загрузите таблицу (CSV, Excel):</label>
        <input type="file" id="dataFile" accept=".csv, .xls, .xlsx">
        <button id="uploadBtn">Загрузить таблицу</button>
        <p id="uploadStatus"></p>

        <label for="cityInput">Введите город:</label>
        <input type="text" id="cityInput" placeholder="Например, Москва">

        <button id="generateReportBtn" disabled>Создать отчет</button>
        <p id="reportStatus"></p>

        <button id="downloadReportBtn">Скачать отчет</button>
    </div>

    <script>
        let uploadedData = "";
        let reportUrl = "";

        document.getElementById("uploadBtn").addEventListener("click", function () {
            let fileInput = document.getElementById("dataFile");
            let statusText = document.getElementById("uploadStatus");
            let reportBtn = document.getElementById("generateReportBtn");

            if (!fileInput.files.length) {
                alert("Выберите файл для загрузки.");
                return;
            }

            let file = fileInput.files[0];
            let formData = new FormData();
            formData.append("file", file);

            statusText.textContent = "Загрузка файла...";

            fetch("/upload_data", {
                method: "POST",
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        statusText.textContent = "Ошибка загрузки: " + data.error;
                    } else {
                        statusText.textContent = "Файл загружен!";
                        uploadedData = data.data;
                        reportBtn.disabled = false;
                    }
                })
                .catch(error => {
                    console.error("Ошибка:", error);
                    statusText.textContent = "Ошибка загрузки файла.";
                });
        });

        document.getElementById("generateReportBtn").addEventListener("click", function () {
            let button = this;
            let statusText = document.getElementById("reportStatus");
            let city = document.getElementById("cityInput").value;
            let downloadBtn = document.getElementById("downloadReportBtn");

            if (!city) {
                alert("Введите название города.");
                return;
            }

            statusText.textContent = "Генерация отчета...";
            button.disabled = true;
            downloadBtn.style.display = "none";

            fetch("/get_real_estate_info", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ city: city, table_data: uploadedData })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.report_url) {
                        reportUrl = data.report_url;
                        downloadBtn.style.display = "block";
                        statusText.textContent = "Отчет готов! Вы можете его скачать.";
                    } else {
                        alert("Ошибка при генерации отчета.");
                    }
                })
                .catch(error => {
                    console.error("Ошибка:", error);
                    alert("Ошибка при генерации отчета.");
                })
                .finally(() => {
                    button.disabled = false;
                });
        });

        document.getElementById("downloadReportBtn").addEventListener("click", function () {
            if (reportUrl) {
                window.location.href = reportUrl;
            } else {
                alert("Отчет еще не создан.");
            }
        });
    </script>
</body>

</html>

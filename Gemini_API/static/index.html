<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ рынка недвижимости</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        input,
        button {
            margin: 10px 0;
            padding: 10px;
            width: 100%;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
            color: blue;
        }
    </style>
</head>

<body>
    <div class="container">
        <input type="file" id="jsonFileInput" accept=".json" onchange="loadJson()" />
        <button onclick="generateReport()">Сформировать отчет</button>
        <p id="status"></p>
    </div>

    <script>
        function loadJson() {
            const fileInput = document.getElementById("jsonFileInput");
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                sessionStorage.setItem("inputJson", e.target.result);
                document.getElementById("status").textContent = "JSON загружен!";
            };

            if (file) {
                reader.readAsText(file);
            }
        }

        async function generateReport() {
            const status = document.getElementById("status");
            const jsonData = sessionStorage.getItem("inputJson");

            if (!jsonData) {
                alert("Сначала загрузите JSON-файл!");
                return;
            }

            status.textContent = "Генерация отчета...";

            try {
                const response = await fetch("/generate_report", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: jsonData
                });

                const result = await response.json();

                if (response.ok) {
                    status.textContent = "Отчет успешно сформирован!";
                    const link = document.createElement("a");
                    link.href = `/download_report/?city=${result.city}`;
                    link.download = `Отчет_${result.city}.docm`;
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                } else {
                    throw new Error(result.detail || "Ошибка генерации отчета");
                }
            } catch (error) {
                status.textContent = "Ошибка при генерации отчета!";
                alert("Ошибка: " + error.message);
            }
        }
    </script>
</body>

</html>
